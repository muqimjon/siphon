<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siphon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #14161c;
    --text: #f2f4f8;
    --hint: #8a93a6;
    --card: #1d212b;
    --btn-text: #06222a;
    --accent: #22d3ee;
    --accent-2: #38f0c8;
    --line: rgba(255,255,255,.08);
    --soft: rgba(255,255,255,.03);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 14px 14px 40px;
    line-height: 1.4;
    max-width: 620px;
    margin: 0 auto;
  }
  .tabs {
    display: flex; gap: 4px; padding: 4px; margin-bottom: 18px;
    background: var(--soft); border: 1px solid var(--line); border-radius: 14px;
  }
  .tab {
    flex: 1; border: 0; background: none; color: var(--hint); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    padding: 9px 4px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: background .15s, color .15s;
  }
  .tab .ico { font-size: 15px; }
  .tab.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-text); }
  .tab:active { transform: scale(.97); }

  .section-title {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--hint); margin: 20px 4px 10px; font-weight: 700;
  }
  .hint { font-size: 12px; color: var(--hint); margin: 0 4px 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px; margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 700; font-size: 15px; }
  .card-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .card-head .sub { margin-left: auto; font-size: 11.5px; color: var(--hint); font-weight: 600; }

  .profile { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 62px; height: 62px; border-radius: 20px; flex: 0 0 auto; object-fit: cover;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: var(--btn-text);
    font-size: 25px; font-weight: 800;
    box-shadow: 0 6px 18px rgba(34,211,238,.3);
  }
  .profile h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .profile .at { margin: 3px 0 0; font-size: 13px; color: var(--accent); font-weight: 600; }
  .profile .uid { margin: 2px 0 0; font-size: 11.5px; color: var(--hint); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 11px 8px; text-align: center; }
  .stat b { display: block; font-size: 19px; font-weight: 800; }
  .stat span { font-size: 10.5px; color: var(--hint); font-weight: 600; }

  .meter { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 12px; }
  .meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .meter-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--hint); margin-top: 7px; font-weight: 600; }

  .list-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .list-row:first-of-type { border-top: 0; }
  .list-row .val { margin-left: auto; color: var(--hint); font-weight: 600; font-size: 12.5px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin: 0 -2px 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: transform .12s, background .15s, border-color .15s;
  }
  .chip.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-text); border-color: transparent; }
  .chip.set::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .chip.on.set::after { background: var(--btn-text); }
  .chip:active { transform: scale(.95); }

  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 2px; }
  .row-label { font-size: 12px; color: var(--hint); margin-bottom: 7px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .row-label .auto { color: var(--accent); font-size: 11px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    border: 1px solid var(--line); background: var(--soft); color: var(--text);
    padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: transform .1s, background .15s, color .15s, border-color .15s;
  }
  .pill.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--btn-text); border-color: transparent;
    box-shadow: 0 4px 12px rgba(34,211,238,.3);
  }
  .pill:active { transform: scale(.93); }

  .adv-toggle {
    display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 6px;
    border: 0; background: none; color: var(--hint); cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 700; padding: 8px 2px;
  }
  .adv-toggle::after { content: "▾"; transition: transform .15s; }
  .adv-toggle.open::after { transform: rotate(180deg); }
  .adv-box { padding-top: 4px; }

  .empty { color: var(--hint); font-size: 14px; text-align: center; padding: 26px 10px; }
  .empty .big { font-size: 30px; display: block; margin-bottom: 8px; }

  .skeleton { height: 92px; border-radius: 18px; background: var(--card); margin-bottom: 14px; animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: .9; } }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 24px);
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-text);
    padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #ef4444; color: #fff; }
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const initData = tg ? tg.initData : "";

const PLATFORMS = [
  { id: "youtube", icon: "▶️" },
  { id: "instagram", icon: "📸" },
  { id: "tiktok", icon: "🎵" },
  { id: "x", icon: "✖️" },
  { id: "facebook", icon: "📘" },
  { id: "other", icon: "🌐" }
];

const KIND_OPTIONS = ["ask", "audio", "video"];
const AUDIO_OPTIONS = ["best", "mp3", "m4a", "opus"];
const VIDEO_OPTIONS = ["best", "mp4", "webm"];
const QUALITY_OPTIONS = ["ask", "high", "medium", "low"];
const LANGS = [
  { id: "uz", flag: "🇺🇿", name: "O'zbekcha" },
  { id: "ru", flag: "🇷🇺", name: "Русский" },
  { id: "en", flag: "🇬🇧", name: "English" }
];

const I18N = {
  uz: {
    tabProfile: "Profil", tabPrefs: "Sozlamalar", tabGroups: "Guruhlar", tabLang: "Til",
    mine: "Yuklab olish sozlamalari", groups: "Guruhlarim",
    hint: "Havola kelganda shu sozlamalar avtomatik qo'llanadi. Har bir sayt uchun alohida.",
    groupHint: "Bot admin bo'lgan guruhlar. Sozlamalar guruhdagi hamma uchun ishlaydi.",
    noGroups: "Sizda hali guruh yo'q.", noGroupsHint: "Botni guruhga admin qilib qo'shing.",
    rowKind: "Tur", rowAudio: "Audio format", rowVideo: "Video format", rowQuality: "Sifat",
    kind_ask: "Har safar so'ra", kind_audio: "Audio", kind_video: "Video",
    ask: "So'ra", best: "⭐ Eng yaxshi", high: "Yuqori", medium: "O'rta", low: "Past",
    other: "Boshqa", saved: "Saqlandi ✓", error: "Xatolik", authFail: "Ochib bo'lmadi",
    statToday: "Bugun", statTotal: "Jami", statLimit: "Fayl", langTitle: "Bot tili",
    langHint: "Bot siz bilan shu tilda gaplashadi.",
    dailyUse: "Bugungi limit", left: "{n} ta qoldi",
    topSites: "Ko'p ishlatilgan", accountTitle: "Hisob",
    autoBest: "sifat yuqori — eng yaxshi format", configured: "sozlangan",
    onlyAudio: "Faqat audio olinadi — video sozlamasi kerak emas.",
    onlyVideo: "Faqat video olinadi — audio sozlamasi kerak emas.",
    advanced: "Qo'shimcha", advancedHint: "Odatda kerak emas — sifat allaqachon manbadagidek saqlanadi."
  },
  ru: {
    tabProfile: "Профиль", tabPrefs: "Настройки", tabGroups: "Группы", tabLang: "Язык",
    mine: "Настройки загрузки", groups: "Мои группы",
    hint: "Применяются автоматически, когда приходит ссылка. Отдельно для каждого сайта.",
    groupHint: "Группы, где бот админ. Настройки действуют для всех участников.",
    noGroups: "У вас пока нет групп.", noGroupsHint: "Добавьте бота в группу как админа.",
    rowKind: "Тип", rowAudio: "Аудио формат", rowVideo: "Видео формат", rowQuality: "Качество",
    kind_ask: "Спрашивать", kind_audio: "Аудио", kind_video: "Видео",
    ask: "Спросить", best: "⭐ Лучшее", high: "Высокое", medium: "Среднее", low: "Низкое",
    other: "Другое", saved: "Сохранено ✓", error: "Ошибка", authFail: "Не удалось открыть",
    statToday: "Сегодня", statTotal: "Всего", statLimit: "Файл", langTitle: "Язык бота",
    langHint: "На этом языке бот будет с вами общаться.",
    dailyUse: "Дневной лимит", left: "осталось {n}",
    topSites: "Часто используемые", accountTitle: "Аккаунт",
    autoBest: "качество высокое — лучший формат", configured: "настроено",
    onlyAudio: "Берётся только аудио — видео настраивать не нужно.",
    onlyVideo: "Берётся только видео — аудио настраивать не нужно.",
    advanced: "Дополнительно", advancedHint: "Обычно не нужно — качество и так сохраняется как в источнике."
  },
  en: {
    tabProfile: "Profile", tabPrefs: "Settings", tabGroups: "Groups", tabLang: "Language",
    mine: "Download settings", groups: "My groups",
    hint: "Applied automatically when a link arrives. Separate for each site.",
    groupHint: "Groups where the bot is an admin. Settings apply to everyone there.",
    noGroups: "You have no groups yet.", noGroupsHint: "Add the bot to a group as an admin.",
    rowKind: "Type", rowAudio: "Audio format", rowVideo: "Video format", rowQuality: "Quality",
    kind_ask: "Ask each time", kind_audio: "Audio", kind_video: "Video",
    ask: "Ask", best: "⭐ Best", high: "High", medium: "Medium", low: "Low",
    other: "Other", saved: "Saved ✓", error: "Error", authFail: "Couldn't open",
    statToday: "Today", statTotal: "Total", statLimit: "File", langTitle: "Bot language",
    langHint: "The bot will talk to you in this language.",
    dailyUse: "Daily limit", left: "{n} left",
    topSites: "Most used", accountTitle: "Account",
    autoBest: "quality is high — best format", configured: "configured",
    onlyAudio: "Audio only — no need to configure video.",
    onlyVideo: "Video only — no need to configure audio.",
    advanced: "Advanced", advancedHint: "Usually not needed — quality is already kept as in the source."
  }
};

let T = I18N.uz;
let data = null;
let tab = "profile";

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function haptic(kind) {
  try { tg && tg.HapticFeedback && (kind === "selection" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred("light")); } catch (e) {}
}

let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 1400);
}

function platformName(id) {
  return id === "youtube" ? "YouTube"
    : id === "instagram" ? "Instagram"
    : id === "tiktok" ? "TikTok"
    : id === "x" ? "X"
    : id === "facebook" ? "Facebook"
    : T.other;
}

function optionLabel(field, value) {
  if (value === "ask") return field === "kind" ? T.kind_ask : T.ask;
  if (value === "best") return T.best;
  if (field === "kind") return T["kind_" + value];
  if (field === "quality") return T[value];
  return value.toUpperCase();
}

function isConfigured(pref) {
  return pref.kind !== "ask" || pref.audioFormat !== "ask" || pref.videoFormat !== "ask" || pref.quality !== "ask";
}

async function api(method, path, body) {
  const res = await fetch("/miniapp" + path, {
    method: method,
    headers: { "Content-Type": "application/json", "Authorization": "tma " + initData },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}

function savePref(scope, groupChatId, pref) {
  return api("PUT", "/prefs", {
    scope: scope,
    groupChatId: groupChatId,
    platform: pref.platform,
    kind: pref.kind,
    audioFormat: pref.audioFormat,
    videoFormat: pref.videoFormat,
    quality: pref.quality
  });
}

function rowsFor(pref) {
  return [
    { field: "kind", label: T.rowKind, options: KIND_OPTIONS },
    { field: "quality", label: T.rowQuality, options: QUALITY_OPTIONS }
  ];
}

function advancedRowsFor(pref) {
  const rows = [];
  if (pref.kind !== "video") rows.push({ field: "audioFormat", label: T.rowAudio, options: AUDIO_OPTIONS });
  if (pref.kind !== "audio") rows.push({ field: "videoFormat", label: T.rowVideo, options: VIDEO_OPTIONS });
  return rows;
}

function board(scope, chatId, platforms, title, subtitle) {
  const byId = {};
  platforms.forEach(p => byId[p.platform] = p);
  let selected = "youtube";

  const card = el("div", "card");
  if (title) {
    const head = el("div", "card-head");
    head.appendChild(el("span", "dot"));
    head.appendChild(el("span", null, title));
    if (subtitle) head.appendChild(el("span", "sub", subtitle));
    card.appendChild(head);
  }

  let advOpen = false;
  const chips = el("div", "chips");
  const panel = el("div", "panel");
  card.appendChild(chips);
  card.appendChild(panel);

  function paintChips() {
    Array.from(chips.children).forEach(c => {
      c.classList.toggle("on", c.dataset.pid === selected);
      c.classList.toggle("set", isConfigured(byId[c.dataset.pid]));
    });
  }

  async function apply(pref, changes) {
    const prev = { kind: pref.kind, audioFormat: pref.audioFormat, videoFormat: pref.videoFormat, quality: pref.quality };
    Object.assign(pref, changes);
    paintChips();
    paintPanel();
    haptic("light");
    try {
      await savePref(scope, chatId, pref);
      toast(T.saved);
    } catch (e) {
      Object.assign(pref, prev);
      paintPanel();
      paintChips();
      toast(T.error, true);
    }
  }

  function paintPanel() {
    panel.innerHTML = "";
    const pref = byId[selected];
    if (pref.kind === "audio") panel.appendChild(el("div", "hint", T.onlyAudio));
    if (pref.kind === "video") panel.appendChild(el("div", "hint", T.onlyVideo));

    const render = r => {
      const row = el("div", "row");
      const label = el("div", "row-label");
      label.appendChild(el("span", null, r.label));
      if (pref.quality === "high" && (r.field === "audioFormat" || r.field === "videoFormat") && pref[r.field] === "best")
        label.appendChild(el("span", "auto", "· " + T.autoBest));
      row.appendChild(label);

      const pills = el("div", "pills");
      r.options.forEach(opt => {
        const pill = el("button", "pill" + (pref[r.field] === opt ? " on" : ""), optionLabel(r.field, opt));
        pill.onclick = () => {
          if (pref[r.field] === opt) return;
          const changes = {};
          changes[r.field] = opt;
          if (r.field === "quality" && opt === "high") {
            changes.audioFormat = "best";
            changes.videoFormat = "best";
          }
          apply(pref, changes);
        };
        pills.appendChild(pill);
      });
      row.appendChild(pills);
      return row;
    };

    rowsFor(pref).forEach(r => panel.appendChild(render(r)));

    const advanced = advancedRowsFor(pref);
    if (advanced.length) {
      const toggle = el("button", "adv-toggle" + (advOpen ? " open" : ""), T.advanced);
      const box = el("div", "adv-box");
      if (!advOpen) box.style.display = "none";
      box.appendChild(el("div", "hint", T.advancedHint));
      advanced.forEach(r => box.appendChild(render(r)));
      toggle.onclick = () => {
        advOpen = !advOpen;
        haptic("selection");
        paintPanel();
      };
      panel.appendChild(toggle);
      panel.appendChild(box);
    }
  }

  PLATFORMS.forEach(p => {
    const chip = el("button", "chip");
    chip.dataset.pid = p.id;
    chip.appendChild(el("span", null, p.icon));
    chip.appendChild(el("span", null, platformName(p.id)));
    chip.onclick = () => { selected = p.id; haptic("selection"); paintChips(); paintPanel(); };
    chips.appendChild(chip);
  });

  paintChips();
  paintPanel();
  return card;
}

function profileView() {
  const frag = document.createDocumentFragment();
  const u = data.user;
  const s = data.stats;

  const card = el("div", "card");
  const row = el("div", "profile");
  if (u.photoUrl) {
    const img = document.createElement("img");
    img.className = "avatar";
    img.src = u.photoUrl;
    img.alt = "";
    row.appendChild(img);
  } else {
    row.appendChild(el("div", "avatar", (u.firstName || "?").charAt(0).toUpperCase()));
  }
  const info = el("div");
  info.appendChild(el("h2", null, [u.firstName, u.lastName].filter(Boolean).join(" ") || "—"));
  if (u.username) info.appendChild(el("p", "at", "@" + u.username));
  info.appendChild(el("p", "uid", "ID " + u.id));
  row.appendChild(info);
  card.appendChild(row);

  const stats = el("div", "stats");
  const mk = (value, label) => {
    const box = el("div", "stat");
    box.appendChild(el("b", null, String(value)));
    box.appendChild(el("span", null, label));
    return box;
  };
  stats.appendChild(mk(s.downloadsToday, T.statToday));
  stats.appendChild(mk(s.totalDownloads, T.statTotal));
  stats.appendChild(mk(s.maxUploadMb + " MB", T.statLimit));
  card.appendChild(stats);

  const pct = s.dailyLimit > 0 ? Math.min(100, Math.round((s.downloadsToday / s.dailyLimit) * 100)) : 0;
  const meter = el("div", "meter");
  const fill = el("i");
  fill.style.width = pct + "%";
  meter.appendChild(fill);
  card.appendChild(meter);
  const ml = el("div", "meter-label");
  ml.appendChild(el("span", null, T.dailyUse));
  ml.appendChild(el("span", null, T.left.replace("{n}", Math.max(0, s.dailyLimit - s.downloadsToday))));
  card.appendChild(ml);
  frag.appendChild(card);

  if (s.topSites && s.topSites.length) {
    frag.appendChild(el("div", "section-title", T.topSites));
    const sites = el("div", "card");
    s.topSites.forEach(t => {
      const r = el("div", "list-row");
      r.appendChild(el("span", null, "🌐"));
      r.appendChild(el("span", null, t.site));
      r.appendChild(el("span", "val", String(t.count)));
      sites.appendChild(r);
    });
    frag.appendChild(sites);
  }
  return frag;
}

function prefsView() {
  const frag = document.createDocumentFragment();
  frag.appendChild(el("div", "section-title", T.mine));
  frag.appendChild(el("div", "hint", T.hint));
  frag.appendChild(board("user", null, data.platforms, null, null));
  return frag;
}

function groupsView() {
  const frag = document.createDocumentFragment();
  frag.appendChild(el("div", "section-title", T.groups));
  frag.appendChild(el("div", "hint", T.groupHint));
  if (!data.groups.length) {
    const empty = el("div", "empty");
    empty.appendChild(el("span", "big", "👥"));
    empty.appendChild(el("div", null, T.noGroups));
    empty.appendChild(el("div", "hint", T.noGroupsHint));
    frag.appendChild(empty);
  } else {
    data.groups.forEach(g => frag.appendChild(board("group", g.chatId, g.platforms, g.title || "—", null)));
  }
  return frag;
}

function langView() {
  const frag = document.createDocumentFragment();
  frag.appendChild(el("div", "section-title", T.langTitle));
  frag.appendChild(el("div", "hint", T.langHint));
  const card = el("div", "card");
  LANGS.forEach(l => {
    const row = el("button", "pill" + (data.user.lang === l.id ? " on" : ""));
    row.style.cssText = "display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:12px 14px;border-radius:14px;font-size:14px";
    row.appendChild(el("span", null, l.flag));
    row.appendChild(el("span", null, l.name));
    row.onclick = async () => {
      if (data.user.lang === l.id) return;
      const prev = data.user.lang;
      data.user.lang = l.id;
      T = I18N[l.id];
      haptic("light");
      render();
      try {
        await api("PUT", "/lang", { lang: l.id });
        toast(T.saved);
      } catch (e) {
        data.user.lang = prev;
        T = I18N[prev];
        render();
        toast(T.error, true);
      }
    };
    card.appendChild(row);
  });
  frag.appendChild(card);
  return frag;
}

const TABS = [
  { id: "profile", icon: "👤", label: "tabProfile", view: profileView },
  { id: "prefs", icon: "⚙️", label: "tabPrefs", view: prefsView },
  { id: "groups", icon: "👥", label: "tabGroups", view: groupsView },
  { id: "lang", icon: "🌍", label: "tabLang", view: langView }
];

function render() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  TABS.forEach(t => {
    const b = el("button", "tab" + (tab === t.id ? " on" : ""));
    b.appendChild(el("span", "ico", t.icon));
    b.appendChild(el("span", null, T[t.label]));
    b.onclick = () => { tab = t.id; haptic("selection"); render(); };
    tabsEl.appendChild(b);
  });

  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(TABS.find(t => t.id === tab).view());
  document.documentElement.lang = data.user.lang;
}

function applyTheme() {
  const p = (tg && tg.themeParams) || {};
  const s = document.documentElement.style;
  const set = (k, v) => { if (v) s.setProperty(k, v); };
  set("--bg", p.bg_color);
  set("--text", p.text_color);
  set("--hint", p.hint_color);
  set("--card", p.secondary_bg_color);
  set("--btn-text", p.button_text_color);
}

function fail(msg) {
  document.getElementById("tabs").innerHTML = "";
  const app = document.getElementById("app");
  app.innerHTML = "";
  const empty = el("div", "empty");
  empty.appendChild(el("span", "big", "🔒"));
  empty.appendChild(el("div", null, msg));
  app.appendChild(empty);
}

async function boot() {
  if (tg) { tg.ready(); tg.expand(); applyTheme(); tg.onEvent("themeChanged", applyTheme); }
  const app = document.getElementById("app");
  app.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  if (!initData) { fail(T.authFail); return; }
  try {
    data = await api("GET", "/profile");
    T = I18N[data.user.lang] || I18N.uz;
    render();
  } catch (e) {
    fail(e.message === "401" ? T.authFail : T.error);
  }
}

boot();
</script>
