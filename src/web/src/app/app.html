<header class="site-header">
  <a class="brand" routerLink="/">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <defs>
        <linearGradient id="sp-drop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22D3EE"/>
          <stop offset="1" stop-color="#0EA5E9"/>
        </linearGradient>
      </defs>
      <path d="M12 2.5C8.7 7.4 5.5 10.9 5.5 14.5a6.5 6.5 0 0 0 13 0c0-3.6-3.2-7.1-6.5-12z" fill="url(#sp-drop)"/>
    </svg>
    <span>Siphon</span>
  </a>

  <nav class="site-nav" [class.open]="menuOpen()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="menuOpen.set(false)">{{ i18n.t('nav.home') }}</a>
    <a routerLink="/docs" routerLinkActive="active" (click)="menuOpen.set(false)">{{ i18n.t('nav.api') }}</a>
    <a routerLink="/bot" routerLinkActive="active" (click)="menuOpen.set(false)">{{ i18n.t('nav.bot') }}</a>
  </nav>

  <div class="header-actions">
    <div class="lang-switch" role="group">
      @for (l of i18n.langs; track l) {
        <button type="button" class="lang-btn" [class.active]="i18n.lang() === l" (click)="i18n.set(l)">{{ l.toUpperCase() }}</button>
      }
    </div>
    <button type="button" class="theme-toggle" [attr.aria-label]="i18n.t('theme.toggle')" (click)="theme.toggle()">
      <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
      </svg>
    </button>
    <button type="button" class="nav-toggle" [attr.aria-label]="i18n.t('nav.menu')" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.update((v) => !v)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <router-outlet/>
</main>

<footer class="site-footer">
  <span class="health-dot" [class.ok]="health()?.ok === true" [class.err]="health() != null && health()!.ok === false"></span>
  <span>{{ healthText() }}</span>
</footer>
