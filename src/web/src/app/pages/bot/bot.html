<header class="bot-hero">
  <h1>{{ i18n.t('bot.title') }}</h1>
  <p>{{ i18n.t('bot.subtitle') }}</p>
  <a class="sp-btn sp-btn-primary bot-cta" [href]="botUrl" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19c-.24 1.06-.87 1.32-1.76.82l-4.86-3.58-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.94 9-8.13c.39-.35-.08-.54-.6-.2L6.77 12.9l-4.8-1.5c-1.04-.32-1.06-1.04.22-1.54l18.77-7.23c.87-.32 1.63.2 1.35 1.67z"/></svg>
    {{ i18n.t('bot.open') }}
  </a>
</header>

<div class="steps">
  @for (n of steps; track n) {
    <div class="step">
      <span class="step-num">{{ n }}</span>
      <div class="step-body">
        <h3>{{ i18n.t('bot.step' + n + 'Title') }}</h3>
        <p>{{ i18n.t('bot.step' + n + 'Desc') }}</p>
      </div>
    </div>
  }
</div>

<div class="bot-notes">
  <div class="bot-note">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
    <span>{{ i18n.t('bot.noteLimit') }}</span>
  </div>
  <div class="bot-note">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span>{{ i18n.t('bot.noteFree') }}</span>
  </div>
</div>
