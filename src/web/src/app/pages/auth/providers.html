<div class="providers">
  @if (available()?.google) {
  <a class="sp-btn sp-btn-secondary provider-btn" href="/api/v1/auth/google">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
      <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3 0-5.6-2-6.6-4.8H1.4v3.1C3.4 21.3 7.4 24 12 24z"/>
      <path fill="#FBBC05" d="M5.4 14.5c-.2-.7-.4-1.5-.4-2.5s.1-1.7.4-2.5V6.4H1.4C.5 8.1 0 10 0 12s.5 3.9 1.4 5.6l4-3.1z"/>
      <path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.4l4 3.1C6.4 6.7 9 4.8 12 4.8z"/>
    </svg>
    {{ i18n.t('auth.google') }}
  </a>
  }

  @if (available()?.github) {
  <a class="sp-btn sp-btn-secondary provider-btn" href="/api/v1/auth/github">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
    </svg>
    {{ i18n.t('auth.github') }}
  </a>
  }

  @if (telegramBot()) {
    <div class="tg-widget" #tgHost></div>
  } @else {
    <button type="button" class="sp-btn sp-btn-secondary provider-btn" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19c-.24 1.06-.87 1.32-1.76.82l-4.86-3.58-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.94 9-8.13c.39-.35-.08-.54-.6-.2L6.77 12.9l-4.8-1.5c-1.04-.32-1.06-1.04.22-1.54l18.77-7.23c.87-.32 1.63.2 1.35 1.67z"/></svg>
      {{ i18n.t('auth.telegram') }}
    </button>
    <p class="provider-note">{{ i18n.t('auth.telegramOff') }}</p>
  }

  <p class="provider-note">{{ i18n.t('auth.providerNote') }}</p>

  @if (error()) {
    <div class="sp-error-card"><strong>{{ i18n.t('auth.error') }}</strong></div>
  }
</div>
