services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: siphon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Siphon__ApiKeys__web: ${WEB_API_KEY}
      Siphon__ApiKeys__bot: ${BOT_API_KEY}
      Siphon__ApiKeys__extension: ${EXTENSION_API_KEY}
      Accounts__ConnectionString: Host=postgres;Database=siphon;Username=postgres;Password=${POSTGRES_PASSWORD}
      Accounts__Jwt__Secret: ${JWT_SECRET}
      Accounts__AdminEmail: ${ADMIN_EMAIL}
      Accounts__WebBaseUrl: https://${WEB_DOMAIN}
      Accounts__BotUsername: ${BOT_USERNAME}
      Accounts__TelegramBotToken: ${BOT_TOKEN}
      Accounts__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Accounts__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Accounts__GitHub__ClientId: ${GITHUB_CLIENT_ID}
      Accounts__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET}
    volumes:
      - api-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=8080

  bot:
    build:
      context: src/bot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      Bot__Token: ${BOT_TOKEN}
      Backend__BaseUrl: http://api:8080
      Backend__ApiKey: ${BOT_API_KEY}
      MiniApp__BaseUrl: https://${BOT_DOMAIN}
    volumes:
      - bot-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.bot.rule=Host(`${BOT_DOMAIN}`)
      - traefik.http.routers.bot.entrypoints=websecure
      - traefik.http.routers.bot.tls.certresolver=le
      - traefik.http.services.bot.loadbalancer.server.port=8090

volumes:
  postgres-data:
  api-data:
  bot-data:
  traefik-certs:
